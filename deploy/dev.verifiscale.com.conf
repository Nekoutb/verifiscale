# =============================================================================
# Apache vhost — dev.verifiscale.com (staging)
# Install to /etc/apache2/sites-available/ then a2ensite.
#
# WHY THIS FILE MUST EXIST: the default vhost on *:443 on this host is
# bp.cm-ea.com (000-bp.cm-ea.com.conf, first alphabetically). Without an exact
# ServerName match for dev.verifiscale.com, staging traffic silently lands on a
# completely different tenant's site.
#
# TLS: reuses the verifiscale.com certificate, which covers only verifiscale.com
# and www.verifiscale.com — NOT this hostname. That is fine while Cloudflare's
# SSL mode is "Full" (Cloudflare does not validate the origin certificate) and
# the visitor only ever sees Cloudflare's own valid certificate. If Cloudflare is
# set to "Full (strict)", this returns HTTP 526 and dev needs its own cert:
#   certbot certonly --webroot -w /var/www/certbot -d dev.verifiscale.com
# then point the two SSLCertificate* lines below at live/dev.verifiscale.com/.
# =============================================================================

<VirtualHost *:80>
    ServerName dev.verifiscale.com

    # Let certbot answer the ACME challenge directly (never proxied)
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev.verifiscale.com

    # --- Staging must never be indexed, by any crawler, ever ----------------
    # `always` so it is emitted on error responses too, not just 2xx.
    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
    </IfModule>

    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    # Everything else -> the DEV Docker nginx on 8081 (prod nginx is on 8080)
    ProxyPreserveHost On
    ProxyPass / http://localhost:8081/
    ProxyPassReverse / http://localhost:8081/

    ErrorLog ${APACHE_LOG_DIR}/dev-verifiscale-error.log
    CustomLog ${APACHE_LOG_DIR}/dev-verifiscale-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/verifiscale.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/verifiscale.com/privkey.pem
</VirtualHost>
</IfModule>
