# FiscAudit Pro — HTTP-only configuration (SSL added later by certbot)
# Once Let's Encrypt certs are obtained, replace this file with fiscaudit.ssl.conf

upstream fiscaudit_api {
    server api:8000;
}

upstream fiscaudit_web {
    server web:3000;
}

# ── HTTP (port 80) ───────────────────────────────────────────────────────────
# Serves the app directly until SSL is set up. After certbot, this will only
# handle the ACME challenge + redirect to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cmimpot.cm www.cmimpot.cm 45.32.150.96 _;

    # ACME challenge — for Let's Encrypt webroot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — everything under /api/* and /auth/*, /datasets/*, etc.
    # We strip /api prefix because the FastAPI app doesn't expect it
    location ~ ^/(auth|audit-cases|brigades|taxpayers|datasets|control-runs|monthly-returns|reference|invoices|users|health|docs|openapi.json|redoc)(/.*)?$ {
        proxy_pass http://fiscaudit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Next.js web app — everything else (including _next/* assets and HMR)
    location / {
        proxy_pass http://fiscaudit_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
