# FiscAudit Pro — HTTP-only configuration (SSL added later by certbot)
# Once Let's Encrypt certs are obtained, replace this file with fiscaudit.ssl.conf

# NOTE — deliberately NOT using `upstream` blocks.
# nginx resolves an upstream's hostname ONCE at startup and caches the IP. Every
# `docker compose up -d api web` gives the container a NEW IP, so nginx kept
# proxying to a dead address and served 502 until it was restarted by hand.
# Resolving through Docker's embedded DNS (127.0.0.11) with the target held in a
# VARIABLE forces nginx to re-resolve at request time, so a container recreate
# no longer takes the site down.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP (port 80) ───────────────────────────────────────────────────────────
# Serves the app directly until SSL is set up. After certbot, this will only
# handle the ACME challenge + redirect to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cmimpot.cm www.cmimpot.cm 45.32.150.96 _;

    # ACME challenge — for Let's Encrypt webroot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — everything under /api/* and /auth/*, /datasets/*, etc.
    # We strip /api prefix because the FastAPI app doesn't expect it
    location ~ ^/(auth|audit-cases|brigades|taxpayers|datasets|control-runs|monthly-returns|reference|invoices|users|health|docs|openapi.json|redoc)(/.*)?$ {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Next.js web app — everything else (including _next/* assets and HMR)
    location / {
        set $web_upstream "web:3000";
        proxy_pass http://$web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
