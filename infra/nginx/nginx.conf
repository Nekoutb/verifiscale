user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow large file uploads (PDFs, GLs)
    client_max_body_size 100M;

    # Real IP from upstream proxies (set later when behind CDN)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    log_format combined_with_time '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time';
    access_log /var/log/nginx/access.log combined_with_time;

    include /etc/nginx/conf.d/*.conf;
}
