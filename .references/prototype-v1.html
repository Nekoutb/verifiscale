<style>
  :root {
    --navy:        #0F2A4A;
    --navy-deep:   #081A2F;
    --navy-soft:   #1B3C66;
    --gold:        #D4A24C;
    --gold-soft:   #F5E6C8;
    --emerald:     #059669;
    --emerald-soft:#D1FAE5;
    --rose:        #DC2626;
    --rose-soft:   #FEE2E2;
    --amber:       #D97706;
    --amber-soft:  #FEF3C7;
    --slate-50:    #F8FAFC;
    --slate-100:   #F1F5F9;
    --slate-200:   #E2E8F0;
    --slate-300:   #CBD5E1;
    --slate-500:   #64748B;
    --slate-700:   #334155;
    --slate-900:   #0F172A;
  }
  html, body { font-family: 'Inter', system-ui, sans-serif; background: var(--slate-50); color: var(--slate-900); }
  .font-display { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; letter-spacing: -0.01em; }
  .bg-navy { background-color: var(--navy); }
  .bg-navy-deep { background-color: var(--navy-deep); }
  .bg-navy-soft { background-color: var(--navy-soft); }
  .text-navy { color: var(--navy); }
  .text-gold { color: var(--gold); }
  .bg-gold { background-color: var(--gold); }
  .bg-gold-soft { background-color: var(--gold-soft); }
  .border-navy { border-color: var(--navy); }
  .border-gold { border-color: var(--gold); }

  /* Sidebar item */
  .nav-item { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition cursor-pointer; }
  .nav-item.active { background: linear-gradient(90deg, rgba(212,162,76,0.18), rgba(212,162,76,0.02)); color: #fff; border-left: 3px solid var(--gold); padding-left: 13px; }
  .nav-section { @apply text-[10px] uppercase tracking-widest text-slate-500 font-semibold px-4 mt-5 mb-2; }

  /* Card */
  .card { @apply bg-white rounded-xl border border-slate-200 shadow-sm; }
  .card-pad { @apply p-5 sm:p-6; }
  .card-head { @apply px-5 sm:px-6 py-4 border-b border-slate-200 flex items-center justify-between; }

  /* Buttons */
  .btn { @apply inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-offset-1; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-soft); }
  .btn-gold { background: var(--gold); color: var(--navy-deep); }
  .btn-gold:hover { background: #C4912E; }
  .btn-ghost { @apply text-slate-700 hover:bg-slate-100; }
  .btn-outline { @apply border border-slate-300 text-slate-700 hover:bg-slate-50; }
  .btn-danger { @apply bg-rose-600 text-white hover:bg-rose-700; }

  /* Badges */
  .badge { @apply inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-medium rounded-full; }
  .badge-ok { background: var(--emerald-soft); color: #065F46; }
  .badge-warn { background: var(--amber-soft); color: #92400E; }
  .badge-err { background: var(--rose-soft); color: #991B1B; }
  .badge-info { background: #DBEAFE; color: #1E40AF; }
  .badge-neutral { background: var(--slate-100); color: var(--slate-700); }

  /* Tables */
  table.tbl { @apply w-full text-sm; }
  table.tbl thead th { @apply text-left px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider text-slate-500 bg-slate-50 border-b border-slate-200; }
  table.tbl tbody td { @apply px-3 py-2.5 border-b border-slate-100; }
  table.tbl tbody tr:hover { background: #FAFBFC; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .neg { color: var(--rose); }

  /* KPI */
  .kpi-card { @apply card card-pad; }
  .kpi-label { @apply text-xs font-medium text-slate-500 uppercase tracking-wider; }
  .kpi-value { @apply text-2xl font-bold text-slate-900 mt-2 font-display; }
  .kpi-sub { @apply text-xs text-slate-500 mt-1; }

  /* Inputs */
  .inp { @apply w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-navy/20 focus:border-navy bg-white; }
  .lbl { @apply block text-xs font-semibold text-slate-600 mb-1.5; }

  /* Login backdrop */
  .login-bg {
    background:
      radial-gradient(1200px 600px at 80% -100px, rgba(212,162,76,0.12), transparent),
      radial-gradient(800px 600px at 10% 110%, rgba(27,60,102,0.4), transparent),
      linear-gradient(135deg, #081A2F 0%, #0F2A4A 60%, #1B3C66 100%);
  }
  .grain {
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* Drop zone */
  .dropzone {
    @apply border-2 border-dashed border-slate-300 rounded-xl bg-slate-50/60 p-8 text-center transition cursor-pointer hover:border-navy hover:bg-slate-50;
  }
  .dropzone.drag { @apply border-navy bg-navy/5; }

  /* Spinner */
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar nice */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Toast */
  #toast-stack { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast { @apply px-4 py-3 rounded-lg shadow-lg text-sm text-white flex items-center gap-2; animation: slideIn 0.25s ease-out; }
  .toast-ok { background: var(--emerald); }
  .toast-err { background: var(--rose); }
  .toast-info { background: var(--navy); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(8, 26, 47, 0.55); backdrop-filter: blur(4px); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #fff; border-radius: 16px; max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; }

  /* Animations */
  .fade-in { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Decorative ribbon */
  .ribbon {
    position: absolute; top: 12px; right: -32px; transform: rotate(45deg);
    background: var(--gold); color: var(--navy-deep);
    padding: 2px 36px; font-size: 10px; font-weight: 700; letter-spacing: 1px;
  }

  /* Progress */
  .progress { @apply h-1.5 bg-slate-200 rounded-full overflow-hidden; }
  .progress > div { @apply h-full rounded-full transition-all; }
</style>
</head>

/* --------- Utilities --------- */
const fmt = {
  money: (n, dec=0) => {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const s = Number(n).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return s.replace(/ /g, ' ');
  },
  signed: (n) => {
    const v = Number(n) || 0;
    return (v < 0 ? '-' : '') + fmt.money(Math.abs(v));
  },
  date: (d) => {
    if (!d) return '—';
    try { return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric'}); } catch(e){ return d; }
  },
  pct: (n) => (n*100).toFixed(1) + '%'
};

const uid = () => 'id-' + Math.random().toString(36).slice(2, 10);

const toast = (msg, kind='info') => {
  const stack = document.getElementById('toast-stack');
  const div = document.createElement('div');
  div.className = `toast toast-${kind}`;
  div.innerHTML = `<span>${msg}</span>`;
  stack.appendChild(div);
  setTimeout(() => { div.style.opacity = '0'; div.style.transform='translateX(20px)'; setTimeout(()=>div.remove(), 250); }, 3500);
};

const modal = (html, onClose) => {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal">${html}</div></div>`;
  document.getElementById('modal-bg').addEventListener('click', (e) => {
    if (e.target.id === 'modal-bg') { closeModal(); onClose && onClose(); }
  });
};

/* Sample general ledger lines (sub-set) */
const SEED_GL = (() => {
  // synthesize ~150 lines across the period
  const rng = (seed=>()=>(seed=seed*9301+49297)%233280/233280)(7);
  const journals = ['VTE','ACH','BNK','OD','CAI','PAY'];
  const lines = [];
  let pieceCounter = 1;
  // Build movements that sum to TB.periodD/periodC for each acct
  for (const a of SEED_TB) {
    // Splits debits
    let remD = a.periodD, remC = a.periodC;
    while (remD > 0) {
      const v = Math.min(remD, Math.round(remD * (0.2 + rng()*0.6)));
      const month = 1 + Math.floor(rng()*12);
      lines.push({
        date: `2024-${String(month).padStart(2,'0')}-${String(2+Math.floor(rng()*26)).padStart(2,'0')}`,
        piece: `${journals[Math.floor(rng()*journals.length)]}-${String(pieceCounter++).padStart(5,'0')}`,
        journal: journals[Math.floor(rng()*journals.length)],
        acct: a.acct, name: a.name,
        libelle: `Mouvement ${a.name}`,
        debit: v, credit: 0
      });
      remD -= v;
    }
    while (remC > 0) {
      const v = Math.min(remC, Math.round(remC * (0.2 + rng()*0.6)));
      const month = 1 + Math.floor(rng()*12);
      lines.push({
        date: `2024-${String(month).padStart(2,'0')}-${String(2+Math.floor(rng()*26)).padStart(2,'0')}`,
        piece: `${journals[Math.floor(rng()*journals.length)]}-${String(pieceCounter++).padStart(5,'0')}`,
        journal: journals[Math.floor(rng()*journals.length)],
        acct: a.acct, name: a.name,
        libelle: `Mouvement ${a.name}`,
        debit: 0, credit: v
      });
      remC -= v;
    }
  }
  // Inject 2 deliberate variances so reconciliation flags them
  lines.push({ date:'2024-08-15', piece:'OD-99001', journal:'OD', acct:'601000', name:'Achats de marchandises',
              libelle:'Régul. achats non rapprochée', debit:1250000, credit:0 });
  lines.push({ date:'2024-11-29', piece:'BNK-99002', journal:'BNK', acct:'512000', name:'Banque - SGC',
              libelle:'Frais bancaires non comptabilisés (GL only)', debit:0, credit:425000 });
  return lines.sort((x,y)=>x.date.localeCompare(y.date));
})();

/* Sample journal entries (each entry = one piece, several lines) */
const SEED_JE = (() => {
  // build entries by piece from GL
  const map = {};
  for (const l of SEED_GL) {
    map[l.piece] = map[l.piece] || { piece:l.piece, date:l.date, journal:l.journal, lines:[] };
    map[l.piece].lines.push({ acct:l.acct, name:l.name, libelle:l.libelle, debit:l.debit, credit:l.credit });

/* Monthly tax returns (TVA, IRPP, Acomptes IS) — sample */
const SEED_MONTHLY = (() => {
  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const rng = (seed=>()=>(seed=seed*9301+49297)%233280/233280)(13);
  const out = [];
  for (const m of months) {
    const ca = 22000000 + Math.round(rng()*8000000);
    const achats = 13000000 + Math.round(rng()*4000000);
    out.push({
      month: `2024-${m}`,
      tvaCollectee: Math.round(ca * 0.1925),
      tvaDeductible: Math.round(achats * 0.1925),
      tvaNette: Math.round(ca*0.1925 - achats*0.1925),
      caDeclare: ca,
      achatsDeclare: achats,
      irpp: Math.round(5800000 + rng()*900000),
      acompteIS: Math.round(ca * 0.022),
      cnps: Math.round(5500000 + rng()*800000)
    });
  }
  return out;
})();

      if (sess && sess.userId) {
        const u = SEED_USERS.find(x => x.id === sess.userId);
        if (u) { this.state.user = u; this.state.currentAudit = SEED_AUDITS[0]; this.state.view = 'dashboard'; }
      }
    } catch(e){}
    this.render();
  },

  go(view) {
    this.state.view = view;
    this.render();
    window.scrollTo({top:0, behavior:'smooth'});
  },

  login(userId) {
    const u = SEED_USERS.find(x => x.id === userId);
    if (!u) return toast('Utilisateur introuvable', 'err');
    this.state.user = u;
    this.state.currentAudit = SEED_AUDITS[0];
    this.state.view = 'dashboard';
    localStorage.setItem('fa_session', JSON.stringify({ userId }));
    toast(`Bienvenue ${u.name.split(' ')[0]}`, 'ok');

  logout() {
    localStorage.removeItem('fa_session');
    this.state.user = null;
    this.state.view = 'login';
    this.render();
  },

  setAudit(id) {
    const a = this.state.audits.find(x => x.id === id);
    if (a) { this.state.currentAudit = a; this.render(); }
  },

  /* ------------- Render dispatcher ------------- */
  render() {
    const root = document.getElementById('app');
    if (this.state.view === 'login' || !this.state.user) {
      root.innerHTML = Views.login();
      Wire.login();
      return;
    }
    root.innerHTML = `
      <div class="flex min-h-screen">
        ${Views.sidebar()}

          <div id="page" class="flex-1 p-6 lg:p-8 fade-in">${this.renderPage()}</div>
        </main>
      </div>
    `;

    Wire.page();
  },

    const v = this.state.view;

    return Views.pages.dashboard();
  }
};

    /* =========================================================
       BALANCE & ROLLFORWARD
       ========================================================= */
    trialBalance() {
      const tb = App.state.data.trialBalance;
      const gl = App.state.data.generalLedger;

      // Aggregate GL movements by account
      const glAgg = {};
      for (const l of gl) {
        glAgg[l.acct] = glAgg[l.acct] || { d:0, c:0 };
        glAgg[l.acct].d += l.debit;
        glAgg[l.acct].c += l.credit;
      }

      // Rollforward analysis: opening + period = closing
      const rolled = tb.map(r => {
        const expCloseD = r.openD + r.periodD - r.periodC;
        const expCloseC = r.openC + r.periodC - r.periodD;
        const tbCloseNet = r.closeD - r.closeC;
        const expCloseNet = (r.openD - r.openC) + (r.periodD - r.periodC);
        const tbVariance = tbCloseNet - expCloseNet;
        const glPeriod = glAgg[r.acct] || { d:0, c:0 };
        const glVariance = (r.periodD - glPeriod.d) + (glPeriod.c - r.periodC);
        return { ...r, expCloseNet, tbCloseNet, tbVariance, glPeriodD:glPeriod.d, glPeriodC:glPeriod.c, glVariance };
      });

      const totRollOk    = rolled.filter(r => Math.abs(r.tbVariance) < 0.01).length;
      const totGlOk      = rolled.filter(r => Math.abs(r.glVariance) < 0.01).length;
      const totGlIssues  = rolled.filter(r => Math.abs(r.glVariance) > 0.01);
      const totRollIssues= rolled.filter(r => Math.abs(r.tbVariance) > 0.01);

      return `
        <div class="mb-6">
          <h1 class="font-display text-2xl font-bold">Balance & Rollforward</h1>
          <p class="text-sm text-slate-500 mt-1">Importer la balance 6 colonnes et le grand livre · vérifier rollforward et écarts par compte.</p>
        </div>

        <!-- Upload zone -->
        <div class="grid md:grid-cols-2 gap-4 mb-6">
          <div class="card card-pad">
            <div class="flex items-center justify-between mb-3">
              <div>
                <div class="font-semibold text-slate-900 text-sm">Balance générale (6 colonnes)</div>
                <div class="text-xs text-slate-500">Format attendu : Excel/CSV — Compte · Libellé · Ouv.D · Ouv.C · Mvt.D · Mvt.C · Clô.D · Clô.C</div>
              </div>
              <span class="badge badge-ok">${tb.length} comptes chargés</span>
            </div>
            <div class="dropzone" data-target="tb">
              ${ico.upload}
              <div class="mt-2 text-sm font-medium text-slate-700">Déposer le fichier ou cliquer pour parcourir</div>
              <div class="text-xs text-slate-500 mt-1">.xlsx, .xls, .csv — jusqu'à 50 Mo</div>
              <input type="file" class="hidden" accept=".xlsx,.xls,.csv" data-upload="tb"/>
            </div>
          </div>
          <div class="card card-pad">
            <div class="flex items-center justify-between mb-3">
              <div>
                <div class="font-semibold text-slate-900 text-sm">Grand livre de la période</div>
                <div class="text-xs text-slate-500">Format : Date · Pièce · Journal · Compte · Libellé · Débit · Crédit</div>
              </div>
              <span class="badge badge-ok">${gl.length} lignes chargées</span>
            </div>
            <div class="dropzone" data-target="gl">
              ${ico.upload}
              <div class="mt-2 text-sm font-medium text-slate-700">Déposer le fichier ou cliquer pour parcourir</div>
              <div class="text-xs text-slate-500 mt-1">.xlsx, .xls, .csv — jusqu'à 200 Mo</div>
              <input type="file" class="hidden" accept=".xlsx,.xls,.csv" data-upload="gl"/>
            </div>
          </div>
        </div>

        <!-- KPI -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="kpi-card"><div class="kpi-label">Comptes contrôlés</div><div class="kpi-value">${rolled.length}</div></div>
          <div class="kpi-card"><div class="kpi-label">Rollforward OK</div><div class="kpi-value text-emerald-600">${totRollOk}</div><div class="kpi-sub">${rolled.length-totRollOk} écarts</div></div>
          <div class="kpi-card"><div class="kpi-label">Rapprochement GL OK</div><div class="kpi-value text-emerald-600">${totGlOk}</div><div class="kpi-sub">${rolled.length-totGlOk} écarts</div></div>
          <div class="kpi-card"><div class="kpi-label">Écart total GL</div><div class="kpi-value ${totGlIssues.length?'text-rose-600':''}">${fmt.signed(totGlIssues.reduce((s,r)=>s+r.glVariance,0))}</div><div class="kpi-sub">FCFA</div></div>
        </div>

        <!-- Issues -->
        ${totGlIssues.length || totRollIssues.length ? `
        <div class="card mb-6">
          <div class="card-head">
            <h3 class="font-semibold text-slate-900">⚠ Écarts identifiés</h3>
            <button class="btn btn-outline" id="export-variances">${ico.download}<span>Exporter</span></button>
          </div>
          <table class="tbl">
            <thead><tr>
              <th>Compte</th><th>Libellé</th><th>Type</th><th class="num">Attendu</th><th class="num">Constaté</th><th class="num">Écart</th><th>Statut</th>
            </tr></thead>
            <tbody>
              ${totRollIssues.map(r => `
                <tr>
                  <td><span class="font-mono text-xs">${r.acct}</span></td>
                  <td>${r.name}</td>
                  <td><span class="badge badge-warn">Rollforward</span></td>
                  <td class="num">${fmt.signed(r.expCloseNet)}</td>
                  <td class="num">${fmt.signed(r.tbCloseNet)}</td>
                  <td class="num ${r.tbVariance<0?'neg':'text-rose-600 font-semibold'}">${fmt.signed(r.tbVariance)}</td>
                  <td><span class="badge badge-err">Non équilibré</span></td>
                </tr>
              `).join('')}
              ${totGlIssues.map(r => `
                <tr>
                  <td><span class="font-mono text-xs">${r.acct}</span></td>
                  <td>${r.name}</td>
                  <td><span class="badge badge-err">Balance ≠ GL</span></td>
                  <td class="num">D ${fmt.money(r.periodD)} / C ${fmt.money(r.periodC)}</td>
                  <td class="num">D ${fmt.money(r.glPeriodD)} / C ${fmt.money(r.glPeriodC)}</td>
                  <td class="num font-semibold ${r.glVariance<0?'neg':'text-rose-600'}">${fmt.signed(r.glVariance)}</td>
                  <td><span class="badge badge-err">À justifier</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        ` : `
        <div class="card card-pad bg-emerald-50/30 border-emerald-200 mb-6">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">${ico.check}</div>
            <div>
              <div class="font-semibold text-emerald-900">Aucun écart détecté</div>
              <div class="text-xs text-emerald-700">Le rollforward et le rapprochement balance/GL sont conformes.</div>
            </div>
          </div>
        </div>
        `}

        <!-- Full Trial Balance with 6 cols -->
        <div class="card">
          <div class="card-head">
            <h3 class="font-semibold text-slate-900">Balance 6 colonnes — Rollforward détaillé</h3>
            <div class="flex gap-2 items-center">
              <input class="inp w-56" placeholder="Filtrer par compte..." id="tb-filter"/>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="tbl">
              <thead><tr>
                <th rowspan="2" class="align-bottom">Compte</th>
                <th rowspan="2" class="align-bottom">Libellé</th>
                <th colspan="2" class="text-center !text-slate-700 bg-slate-100">Solde d'ouverture</th>
                <th colspan="2" class="text-center !text-slate-700 bg-slate-100">Mouvements période</th>
                <th colspan="2" class="text-center !text-slate-700 bg-slate-100">Solde de clôture</th>
                <th rowspan="2" class="align-bottom !text-center">Écart</th>
              </tr><tr>
                <th class="num">Débit</th><th class="num">Crédit</th>
                <th class="num">Débit</th><th class="num">Crédit</th>
                <th class="num">Débit</th><th class="num">Crédit</th>
              </tr></thead>
              <tbody id="tb-rows">
                ${rolled.map(r => `
                  <tr data-row="${r.acct}|${r.name.toLowerCase()}">
                    <td><span class="font-mono text-xs">${r.acct}</span></td>
                    <td class="font-medium text-slate-800">${r.name}</td>
                    <td class="num">${r.openD?fmt.money(r.openD):'—'}</td>
                    <td class="num">${r.openC?fmt.money(r.openC):'—'}</td>
                    <td class="num">${r.periodD?fmt.money(r.periodD):'—'}</td>
                    <td class="num">${r.periodC?fmt.money(r.periodC):'—'}</td>
                    <td class="num">${r.closeD?fmt.money(r.closeD):'—'}</td>
                    <td class="num">${r.closeC?fmt.money(r.closeC):'—'}</td>
                    <td class="num">${Math.abs(r.tbVariance)<0.01 ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-err">'+fmt.signed(r.tbVariance)+'</span>'}</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr class="bg-slate-50 font-semibold">
                  <td colspan="2">TOTAUX</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.openD,0))}</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.openC,0))}</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.periodD,0))}</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.periodC,0))}</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.closeD,0))}</td>
                  <td class="num">${fmt.money(rolled.reduce((s,r)=>s+r.closeC,0))}</td>
                  <td></td>

    /* =========================================================
       INTÉGRITÉ DES ÉCRITURES
       ========================================================= */
    integrity() {
      const entries = App.state.data.journalEntries;
      const enriched = entries.map(e => {
        const d = e.lines.reduce((s,l)=>s+l.debit, 0);
        const c = e.lines.reduce((s,l)=>s+l.credit, 0);
        return { ...e, totalD:d, totalC:c, diff:d-c, balanced: Math.abs(d-c) < 0.01 };
      });
      const unbalanced = enriched.filter(e => !e.balanced);
      const totalLines = enriched.reduce((s,e)=>s+e.lines.length, 0);

      return `
        <div class="mb-6 flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1 class="font-display text-2xl font-bold">Intégrité des écritures comptables</h1>
            <p class="text-sm text-slate-500 mt-1">Chaque pièce comptable doit s'équilibrer individuellement (∑ Débits = ∑ Crédits).</p>
          </div>
          <button class="btn btn-gold" id="run-integrity">${ico.play}<span>Relancer le contrôle</span></button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="kpi-card"><div class="kpi-label">Écritures contrôlées</div><div class="kpi-value">${enriched.length}</div></div>
          <div class="kpi-card"><div class="kpi-label">Lignes contrôlées</div><div class="kpi-value">${totalLines}</div></div>
          <div class="kpi-card"><div class="kpi-label">Écritures équilibrées</div><div class="kpi-value text-emerald-600">${enriched.length-unbalanced.length}</div><div class="kpi-sub">${fmt.pct((enriched.length-unbalanced.length)/enriched.length)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Écritures déséquilibrées</div><div class="kpi-value ${unbalanced.length?'text-rose-600':'text-emerald-600'}">${unbalanced.length}</div><div class="kpi-sub">${unbalanced.length?'À justifier impérativement':'Conforme'}</div></div>
        </div>

        ${unbalanced.length ? `
        <div class="card mb-6">
          <div class="card-head"><h3 class="font-semibold text-rose-700">⚠ Écritures non-équilibrées</h3><span class="badge badge-err">${unbalanced.length}</span></div>
          <div>
            ${unbalanced.map(e => `
              <div class="border-b border-slate-100 last:border-0">
                <div class="px-5 py-3 bg-rose-50/40 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="font-mono text-xs font-semibold text-rose-900">${e.piece}</span>
                    <span class="text-xs text-slate-500">${fmt.date(e.date)} · Journal ${e.journal}</span>
                  </div>
                  <div class="text-sm font-semibold text-rose-700">Écart : ${fmt.signed(e.diff)}</div>
                </div>
                <table class="tbl">
                  <tbody>
                    ${e.lines.map(l => `
                      <tr>
                        <td style="padding-left:1.25rem"><span class="font-mono text-xs">${l.acct}</span> · ${l.name}</td>
                        <td class="text-slate-600">${l.libelle}</td>
                        <td class="num">${l.debit?fmt.money(l.debit):'—'}</td>
                        <td class="num">${l.credit?fmt.money(l.credit):'—'}</td>
                      </tr>
                    `).join('')}
                    <tr class="bg-slate-50 font-semibold">
                      <td colspan="2" style="padding-left:1.25rem">Total</td>
                      <td class="num">${fmt.money(e.totalD)}</td>
                      <td class="num">${fmt.money(e.totalC)}</td>

    /* =========================================================
       ÉQUILIBRE DE LA BALANCE
       ========================================================= */
    tbBalance() {
      const tb = App.state.data.trialBalance;
      const openD = tb.reduce((s,r)=>s+r.openD,0);
      const openC = tb.reduce((s,r)=>s+r.openC,0);
      const periodD = tb.reduce((s,r)=>s+r.periodD,0);
      const periodC = tb.reduce((s,r)=>s+r.periodC,0);
      const closeD = tb.reduce((s,r)=>s+r.closeD,0);
      const closeC = tb.reduce((s,r)=>s+r.closeC,0);

      const okOpen = Math.abs(openD-openC) < 0.01;
      const okPeriod = Math.abs(periodD-periodC) < 0.01;
      const okClose = Math.abs(closeD-closeC) < 0.01;

      // by SYSCOHADA class
      const byClass = {};
      for (const r of tb) {
        const cls = r.acct[0];
        byClass[cls] = byClass[cls] || { d:0, c:0, n:0 };
        byClass[cls].d += r.closeD;
        byClass[cls].c += r.closeC;
        byClass[cls].n++;
      }
      const classNames = {
        '1':'Comptes de ressources durables', '2':'Comptes d\'actif immobilisé',
        '3':'Comptes de stocks', '4':'Comptes de tiers',
        '5':'Comptes de trésorerie', '6':'Comptes de charges',
        '7':'Comptes de produits', '8':'Comptes des autres charges/produits HAO'
      };

      return `
        <div class="mb-6">
          <h1 class="font-display text-2xl font-bold">Équilibre de la balance générale</h1>
          <p class="text-sm text-slate-500 mt-1">Vérification globale : <span class="font-medium">Σ Débits = Σ Crédits</span> sur ouverture, mouvements et clôture.</p>
        </div>

        <div class="grid md:grid-cols-3 gap-4 mb-6">
          ${[
            ['Soldes d\'ouverture', openD, openC, okOpen],
            ['Mouvements de période', periodD, periodC, okPeriod],
            ['Soldes de clôture', closeD, closeC, okClose]
          ].map(([t, d, c, ok]) => `
            <div class="card card-pad ${ok?'border-emerald-200 bg-emerald-50/20':'border-rose-200 bg-rose-50/20'}">
              <div class="flex items-center justify-between mb-3">
                <div class="text-sm font-semibold text-slate-700">${t}</div>
                <span class="badge ${ok?'badge-ok':'badge-err'}">${ok?'Équilibré':'Écart '+fmt.signed(d-c)}</span>
              </div>
              <div class="space-y-1.5">
                <div class="flex items-center justify-between text-sm"><span class="text-slate-500">Total Débit</span><span class="num font-semibold">${fmt.money(d)}</span></div>
                <div class="flex items-center justify-between text-sm"><span class="text-slate-500">Total Crédit</span><span class="num font-semibold">${fmt.money(c)}</span></div>
                <div class="border-t pt-2 mt-2 flex items-center justify-between text-sm">
                  <span class="text-slate-600">Différence</span>
                  <span class="num font-bold ${ok?'text-emerald-600':'text-rose-600'}">${fmt.signed(d-c)}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
          <div class="card lg:col-span-2">
            <div class="card-head">
              <h3 class="font-semibold">Répartition par classe SYSCOHADA</h3>
              <span class="badge badge-neutral">${tb.length} comptes</span>
            </div>
            <div class="card-pad">
              <canvas id="class-chart" height="120"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3 class="font-semibold">Détail par classe</h3></div>
            <table class="tbl">
              <thead><tr><th>Cl.</th><th>Libellé</th><th class="num">Cpt</th><th class="num">Solde net</th></tr></thead>
              <tbody>
                ${Object.entries(byClass).sort().map(([k, v]) => `
                  <tr><td class="font-mono font-semibold">${k}</td><td class="text-xs text-slate-600">${(classNames[k]||'').slice(0,28)}</td><td class="num">${v.n}</td><td class="num">${fmt.signed(v.d - v.c)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    },

    /* =========================================================
       DÉCLARATIONS MENSUELLES
       ========================================================= */
    monthlyRet() {
      const m = App.state.data.monthlyReturns;
      const tb = App.state.data.trialBalance;
      const gl = App.state.data.generalLedger;

      // Aggregate GL by month for TVA accounts (4431 collectée, 4452 déductible)
      const glByMonthTVAColl = {}, glByMonthTVADed = {}, glByMonthSales = {};
      for (const l of gl) {
        const month = l.date.slice(0,7);
        if (l.acct === '4431000') glByMonthTVAColl[month] = (glByMonthTVAColl[month]||0) + (l.credit - l.debit);
        if (l.acct === '4452000') glByMonthTVADed[month]  = (glByMonthTVADed[month]||0)  + (l.debit - l.credit);
        if (l.acct.startsWith('70'))  glByMonthSales[month] = (glByMonthSales[month]||0)  + (l.credit - l.debit);
      }

      const recon = m.map(r => {
        const glColl = glByMonthTVAColl[r.month] || 0;
        const glDed  = glByMonthTVADed[r.month] || 0;
        const glCA   = glByMonthSales[r.month] || 0;
        return {
          ...r,
          glColl, glDed, glCA,
          ecartColl: r.tvaCollectee - glColl,
          ecartDed:  r.tvaDeductible - glDed,
          ecartCA:   r.caDeclare - glCA
        };
      });

      const totalEcartColl = recon.reduce((s,r)=>s+r.ecartColl,0);
      const totalEcartDed  = recon.reduce((s,r)=>s+r.ecartDed,0);

      return `
        <div class="mb-6 flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1 class="font-display text-2xl font-bold">Rapprochement des déclarations mensuelles</h1>

            <button class="btn btn-outline" id="upload-monthly">${ico.upload}<span>Importer déclarations</span></button>

          </div>
        </div>

        <!-- Pluggable logic notice -->
        <div class="card card-pad mb-6 border-amber-200 bg-amber-50/30">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0">${ico.info}</div>
            <div class="flex-1">
              <div class="font-semibold text-amber-900">Logique de rapprochement configurable</div>
              <div class="text-sm text-amber-800 mt-1 leading-relaxed">La logique par défaut applique : <span class="font-mono text-xs">TVA Collectée déclarée ≡ Σ (crédit 4431 − débit 4431) du mois</span> · <span class="font-mono text-xs">TVA Déductible ≡ Σ (débit 4452 − crédit 4452)</span> · <span class="font-mono text-xs">CA déclaré ≡ Σ classe 70</span>. Les règles spécifiques (CSI, retenues sur loyers, exonérations sectorielles) seront branchées via le moteur de règles configurables.</div>
              <button class="btn btn-outline mt-3" style="padding:4px 12px;font-size:12px" id="configure-rules">Configurer les règles métier</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="kpi-card"><div class="kpi-label">Périodes contrôlées</div><div class="kpi-value">${recon.length}</div></div>
          <div class="kpi-card"><div class="kpi-label">Total TVA collectée déclarée</div><div class="kpi-value">${fmt.money(recon.reduce((s,r)=>s+r.tvaCollectee,0))}</div></div>
          <div class="kpi-card"><div class="kpi-label">Écart cumulé TVA coll.</div><div class="kpi-value ${Math.abs(totalEcartColl)>1?'text-rose-600':''}">${fmt.signed(totalEcartColl)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Écart cumulé TVA déd.</div><div class="kpi-value ${Math.abs(totalEcartDed)>1?'text-amber-600':''}">${fmt.signed(totalEcartDed)}</div></div>
        </div>

        <div class="card mb-6">
          <div class="card-head"><h3 class="font-semibold">Évolution mensuelle TVA</h3><span class="badge badge-info">Déclaré vs GL</span></div>
          <div class="card-pad"><canvas id="tva-chart" height="80"></canvas></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="font-semibold">Rapprochement détaillé par mois</h3>
            <button class="btn btn-outline">${ico.download}<span>Exporter</span></button>
          </div>

            <table class="tbl">
              <thead><tr>
                <th>Mois</th>

              <tbody>
                ${recon.map(r => {

                  return `

                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    },

  /* ----- Dropzones (Excel parsing) ----- */
  attachDropzones() {
    document.querySelectorAll('.dropzone').forEach(zone => {
      const input = zone.querySelector('input[type=file]');
      zone.addEventListener('click', () => input?.click());
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
      zone.addEventListener('drop', e => {
        e.preventDefault(); zone.classList.remove('drag');
        if (e.dataTransfer.files.length) Wire.handleFile(e.dataTransfer.files[0], zone.dataset.target);
      });
      input?.addEventListener('change', e => { if (e.target.files[0]) Wire.handleFile(e.target.files[0], zone.dataset.target); });
    });
  },

  handleFile(file, target) {
    toast(`Lecture de ${file.name}...`, 'info');
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'binary' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        toast(`${rows.length} lignes importées · contrôles lancés`, 'ok');

        if (target === 'tb' && rows.length) {
          // map columns by first matching key
          const mapped = rows.map(r => Wire.mapTBRow(r)).filter(r => r.acct);
          if (mapped.length) {
            App.state.data.trialBalance = mapped;
            App.render();
          }
        }
        if (target === 'gl' && rows.length) {
          const mapped = rows.map(r => Wire.mapGLRow(r)).filter(r => r.acct);
          if (mapped.length) {
            App.state.data.generalLedger = mapped;
            App.render();
          }
        }
      } catch (err) {
        console.error(err);
        toast('Erreur de lecture du fichier — vérifiez le format', 'err');
      }
    };
    reader.readAsBinaryString(file);
  },

  mapTBRow(r) {
    const keys = Object.keys(r);
    const get = (...names) => {
      for (const n of names) {
        const k = keys.find(x => x.toLowerCase().includes(n.toLowerCase()));
        if (k && r[k] !== '') return r[k];
      }
      return null;
    };
    const num = v => Number(String(v || '').replace(/[^\d.-]/g,'')) || 0;
    return {
      acct: String(get('compte','acct','account','n°','numero')||'').trim(),
      name: String(get('libellé','libelle','intitulé','intitule','name','description')||'').trim(),
      openD: num(get('ouverture débit','ouv.d','opening debit','sodebit','ouvd')),
      openC: num(get('ouverture crédit','ouv.c','opening credit','socredit','ouvc')),
      periodD: num(get('mouvement débit','mvt.d','mvt débit','period debit','movd')),
      periodC: num(get('mouvement crédit','mvt.c','mvt crédit','period credit','movc')),
      closeD: num(get('clôture débit','clô.d','closing debit','solded','scdebit')),
      closeC: num(get('clôture crédit','clô.c','closing credit','soldec','sccredit')),
    };
  },

  mapGLRow(r) {
    const keys = Object.keys(r);
    const get = (...names) => {
      for (const n of names) {
        const k = keys.find(x => x.toLowerCase().includes(n.toLowerCase()));
        if (k && r[k] !== '') return r[k];
      }
      return null;
    };
    const num = v => Number(String(v || '').replace(/[^\d.-]/g,'')) || 0;
    return {
      date: String(get('date')||'').slice(0,10),
      piece: String(get('pièce','piece','document')||'').trim(),
      journal: String(get('journal','code journal')||'').trim(),
      acct: String(get('compte','acct')||'').trim(),
      name: String(get('libellé compte','intitulé','name')||'').trim(),
      libelle: String(get('libellé','libelle','description')||'').trim(),
      debit: num(get('débit','debit','montant débit')),
      credit: num(get('crédit','credit','montant crédit'))
    };
  },

  exportCurrent() {
    Wire.exportToExcel(`fiscaudit_${App.state.view}_${Date.now()}.xlsx`);
  },

  exportToExcel(filename) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(App.state.data.trialBalance);
    XLSX.utils.book_append_sheet(wb, ws, 'Balance');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(App.state.data.generalLedger.slice(0,500)), 'GL');
    XLSX.writeFile(wb, filename);
    toast('Export généré', 'ok');
  }
};

/* --------- Boot --------- */
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
