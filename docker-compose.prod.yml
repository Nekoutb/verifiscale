# =============================================================================
# FiscAudit Pro — Production stack
# Run on the server:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: fiscaudit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Not exposed publicly — only the API needs it
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: fiscaudit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_LOCAL_DIR: /storage
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 240
      CORS_ORIGINS: ${CORS_ORIGINS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@verifiscale.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VerifiScale}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://verifiscale.com}
    expose:
      - "8000"
    volumes:
      - api_storage:/storage

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: fiscaudit-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3000"
    # --- hardening (post-incident 2026-07): a miner previously executed from
    # /tmp inside this container. Block that class of attack outright. ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # writable but NON-EXECUTABLE /tmp: a dropped binary cannot be run
      - /tmp:rw,noexec,nosuid,size=128m

  nginx:
    image: nginx:1.27-alpine
    container_name: fiscaudit-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    # Coexist with the host's Apache (which holds 80/443).
    # Apache vhost reverse-proxies cmimpot.cm → localhost:8080 here.
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro

  # Run once via `docker compose run --rm certbot` to obtain certificates
  certbot:
    image: certbot/certbot:latest
    container_name: fiscaudit-certbot
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'Run: docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d cmimpot.cm -d www.cmimpot.cm --email admin@cmimpot.cm --agree-tos --no-eff-email'"]

volumes:
  pg_data:
  api_storage:
